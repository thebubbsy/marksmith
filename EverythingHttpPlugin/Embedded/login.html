<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Everything Web Suite</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body class="login-page-body">
  <div class="login-card">
    <div class="login-brand-header">
      <div class="login-icon-box">⚡</div>
      <h2>Everything Web Suite</h2>
      <p>High-performance media indexer & streaming hub</p>
    </div>

    <div class="login-engine-status" id="engineStatusBox">
      <span>Backend Engine</span>
      <span id="engineStatusText">Checking connection...</span>
    </div>

    <div class="login-alert error" id="loginAlert"></div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-with-icon">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            placeholder="Enter username" 
            autocomplete="username" 
            required 
            autofocus
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            placeholder="Enter password" 
            autocomplete="current-password" 
            required
          >
          <button type="button" class="password-toggle" id="togglePasswordBtn" title="Toggle password visibility">👁️</button>
        </div>
      </div>

      <div class="login-checkbox-row">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe">
          <span>Remember this session</span>
        </label>
        <a href="#" id="fillDefaultBtn" style="color: var(--accent-primary); text-decoration: none; font-size: 0.8rem;">Auto-fill Local</a>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn" style="width: 100%; padding: 0.85rem; font-size: 0.95rem;">
        <span id="btnText">Sign In</span>
      </button>
    </form>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
