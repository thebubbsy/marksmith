ShortDescription: Turn AI chats into polished PDF and DOCX documents.
Description: >-
  Marksmith is a native WinUI 3 desktop app that turns Markdown — especially replies from
  ChatGPT, Gemini, and Claude — into professional PDF or DOCX documents. It detects the AI
  source, cleans up the formatting quirks each assistant leaves behind (LaTeX delimiters,
  citation pips, pseudo-headings), and renders the result with proper math, syntax
  highlighting, Mermaid diagrams, and your choice of theme. It also works as a plain live
  Markdown editor, watches folders and the clipboard for hands-free conversion, and exposes
  a local REST API plus a companion browser extension.
