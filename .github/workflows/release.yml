name: Release

# Push a version tag (e.g. `git tag v1.7.0 && git push origin v1.7.0`) and this builds the
# marksmith-v2 WinUI app as:
#   - a self-contained Windows exe wrapped in a silent Inno Setup installer, and
#   - a zipped portable build.
# All assets + their SHA256 checksums are published together as one GitHub Release.
# Can also be run manually against an existing tag via "Run workflow".

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.7.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # Create a draft release so we can upload files to it.
          # If it already exists, this command might fail, so we handle it gracefully.
          gh release create "$tag" --draft --title "Marksmith $tag" --notes "Release in progress..." || true

  release-winui:
    name: Build Marksmith v2 (${{ matrix.arch }})
    needs: create-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # x64 = standard 64-bit Windows; arm64 = native Windows on ARM (Snapdragon X Elite/Plus
        # and similar Copilot+ PCs). Each leg publishes, zips, builds its own installer, and
        # uploads its own assets, so a release ends up with both architectures.
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained exe (marksmith-v2, ${{ matrix.arch }})
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $ver = $tag.TrimStart('v', 'V')
          Write-Host "Publishing version $ver for tag $tag"
          dotnet publish marksmith-v2/MarkSmith.Desktop/MarkSmith.Desktop.csproj -c Release -r win-${{ matrix.arch }} --self-contained true -p:Platform=${{ matrix.arch }} -p:DebugType=none -p:Version=$ver -p:AssemblyVersion="$ver.0" -p:FileVersion="$ver.0"

      - name: Package portable zip
        shell: pwsh
        run: |
          $pub = "marksmith-v2/MarkSmith.Desktop/bin/${{ matrix.arch }}/Release/net8.0-windows10.0.19041.0/win-${{ matrix.arch }}/publish"
          New-Item -ItemType Directory -Force -Path staging/Marksmith | Out-Null
          Copy-Item "$pub/*" staging/Marksmith -Recurse -Force
          Compress-Archive -Path staging/Marksmith -DestinationPath Marksmith-win-${{ matrix.arch }}.zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DArch=${{ matrix.arch }}" "packaging\installer\marksmith.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # Delta update feed: publish the full file tree + a file-manifest.json (path -> sha256/size)
      # so the client can diff against its installed files and download ONLY the changed ones.
      # Files land at update/<ver>/<arch>/... on the release-dist branch (see publish-release).
      - name: Build delta update tree (${{ matrix.arch }})
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $ver = $tag.TrimStart('v', 'V')
          $pub = "marksmith-v2/MarkSmith.Desktop/bin/${{ matrix.arch }}/Release/net8.0-windows10.0.19041.0/win-${{ matrix.arch }}/publish"
          $root = "delta/$ver/${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "$pub/*" $root -Recurse -Force
          $files = Get-ChildItem -Path $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $root).Path.Length + 1).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [pscustomobject]@{ path = $rel; sha256 = $hash; size = $_.Length }
          }
          $manifest = [pscustomobject]@{
            format   = 'marksmith-file-manifest'
            schema   = 1
            release  = $ver
            arch     = "${{ matrix.arch }}"
            base_url = 'https://raw.githubusercontent.com/thebubbsy/marksmith/release-dist/update'
            files    = $files
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "$root/file-manifest.json" -Encoding utf8

      - name: Upload delta tree (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: delta-update-${{ matrix.arch }}
          path: delta/
          if-no-files-found: error

      - name: Upload release assets (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          gh release upload $tag Marksmith-win-${{ matrix.arch }}.zip dist_installer/Marksmith-Setup-${{ matrix.arch }}.exe --clobber

  publish-release:
    name: Publish GitHub Release
    needs: [release-winui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download delta trees
        uses: actions/download-artifact@v4
        with:
          path: delta-artifacts
          pattern: delta-update-*

      # Publish the delta feed to the release-dist branch: update/<ver>/<arch>/... + manifests.
      # raw.githubusercontent.com serves it with zero repo-settings dependency; GitHub Pages
      # (https://thebubbsy.github.io/marksmith/update/...) is tried first by the client when enabled.
      - name: Publish delta feed (release-dist branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          ver="${tag#v}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin release-dist || true
          if git rev-parse --verify origin/release-dist >/dev/null 2>&1; then
            git checkout release-dist
          else
            git checkout --orphan release-dist
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "update/$ver"
          cp -r delta-artifacts/delta-update-x64/$ver/* "update/$ver/" 2>/dev/null || true
          cp -r delta-artifacts/delta-update-arm64/$ver/* "update/$ver/" 2>/dev/null || true

          git add -A
          git commit -m "Delta feed: $ver [skip ci]" --allow-empty || true
          git push origin release-dist

      - name: Consolidate and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"

          mkdir -p release-assets
          cd release-assets

          # Download all assets
          gh release download "$tag"

          # Calculate checksums (x64 + arm64 installers and portable zips)
          sha256sum Marksmith-win-x64.zip Marksmith-Setup-x64.exe Marksmith-win-arm64.zip Marksmith-Setup-arm64.exe > checksums.txt

          # Upload checksums file to release
          gh release upload "$tag" checksums.txt --clobber

          # Build release notes
          cat > ../release-notes.md <<'BODY'
          ## Marksmith for Windows

          **64-bit (x64)** — standard Windows PCs
          - `Marksmith-Setup-x64.exe` — installer (recommended)
          - `Marksmith-win-x64.zip` — portable, unzip and run

          **ARM64** — Windows on ARM (Snapdragon X Elite/Plus and similar Copilot+ PCs)
          - `Marksmith-Setup-arm64.exe` — installer (recommended)
          - `Marksmith-win-arm64.zip` — portable, unzip and run

          This build ships the enhanced marksmith-v2 app: a full Markdown editor with live preview,
          find & replace, split view, line numbers, a Markdown lint panel, focus mode, text
          transforms, line operations, document cleanup, word-wrap toggle, and print support — plus
          Mermaid diagrams that now shrink-to-fit the preview instead of clipping at the edge, and a
          fix for a startup crash tied to the Ctrl+, settings shortcut.

          **Requires:** the WebView2 Runtime, which ships by default with Windows 10 21H2+ and
          Windows 11. If it's missing, get it from https://developer.microsoft.com/microsoft-edge/webview2/.

          The .NET runtime and all bundled mermaid/KaTeX/highlight.js assets are included; you do not
          need .NET installed separately.

          BODY

          {
            echo "### SHA256 checksums"
            echo ""
            echo "| File | SHA256 |"
            echo "| --- | --- |"
            while read -r hash file; do
              filename=$(basename "$file")
              echo "| $filename | \`$hash\` |"
            done < checksums.txt
            echo ""
            echo "Paste the Windows installer hash into winget \`InstallerSha256\` and Chocolatey \`checksum64\`."
          } >> ../release-notes.md

          cd ..
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

          # Undraft and update notes
          gh release edit "$tag" --draft=false --notes-file release-notes.md
