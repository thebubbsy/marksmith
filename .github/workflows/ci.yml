name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'MdToPdf/**'
      - 'MdToPdf.Core/**'
      - 'MdToPdf.Avalonia/**'
      - 'MdToPdf.sln'
      - 'extension/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  app:
    name: Build WinUI app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release, x64)
        run: dotnet build MdToPdf/MdToPdf.csproj -c Release -p:Platform=x64

  avalonia:
    name: Build Avalonia app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build MdToPdf.Avalonia/MdToPdf.Avalonia.csproj -c Release

  extension:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON (manifest + managed schema)
        run: node -e "require('./extension/manifest.json'); require('./extension/managed_schema.json'); console.log('JSON OK')"

      - name: Syntax-check scripts
        run: |
          for f in extension/*.js; do node --check "$f" && echo "ok: $f"; done
